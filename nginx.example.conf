server {
    listen 443 ssl;
    server_name inspection.example.com;
    # Configure real certificates before enabling this server.
    ssl_certificate /etc/letsencrypt/live/inspection.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inspection.example.com/privkey.pem;
    root /srv/apartment-inspection/dist;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json
        image/svg+xml font/ttf font/otf font/woff font/woff2
        application/font-woff application/vnd.ms-fontobject application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Keep every add_header at this level so HTML and SPA fallback inherit all.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
